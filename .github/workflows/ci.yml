name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Validate manifest, strings, and integration structure ──────────────
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: "home-assistant/actions/hassfest@master"

  # ── HACS custom integration validation ─────────────────────────────────
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  # ── Lint with ruff ──────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check custom_components/dockhand/ tests/
      - name: Run ruff format check
        run: ruff format --check custom_components/dockhand/ tests/

  # ── Full test suite via pytest-homeassistant-custom-component ───────────
  # PHCC pins an exact HA release and provides the same test infrastructure
  # used by HA core. See requirements_test.txt for the pinned version and
  # docs/development.md for local setup instructions.
  tests:
    name: Tests (pytest + PHCC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Strict typing (mypy, Home Assistant core settings)
        run: mypy
      - name: Run test suite (100% line coverage)
        run: >
          pytest tests/ -v --tb=short
          --cov=custom_components/dockhand --cov-report=term-missing:skip-covered
          --cov-fail-under=100

  # ── Quality scale rules vs Home Assistant core ──────────────────────────
  # hassfest only checks quality_scale.yaml for core integrations; this
  # fails when Home Assistant adds or retires a rule our file doesn't cover.
  # See docs/QUALITY_SCALE.md.
  quality-scale:
    name: Quality scale rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Compare quality_scale.yaml with Home Assistant's rule list
        run: python3 scripts/check_quality_scale.py
